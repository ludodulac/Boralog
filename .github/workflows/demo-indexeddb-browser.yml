name: Boralog demo IndexedDB browser test
on:
  pull_request:
    paths:
      - 'src/lib/demo/local-db.ts'
      - 'tests/demo-indexeddb-browser.mjs'
      - '.github/workflows/demo-indexeddb-browser.yml'
  workflow_dispatch:
jobs:
  indexeddb-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/demo-indexeddb-browser.mjs
