name: BORALOG-163 remote apply once

on:
  push:
    branches:
      - ops/boralog-163-remote-apply
    paths:
      - .github/workflows/boralog-163-remote-apply-once.yml

permissions:
  contents: read

concurrency:
  group: boralog-supabase-migration-control-plane
  cancel-in-progress: false

jobs:
  apply:
    name: Apply BORALOG-163 only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPECTED_PROJECT_REF: jwtawyeuyvqjikjvfhri
      EXPECTED_SOURCE_SHA: e486c2ead65350c4c97440d5ffdc044ff0ce7f07
      EXPECTED_MIGRATION_VERSION: "20261001163000"
      EXPECTED_MIGRATION_FILE: supabase/migrations/20261001163000_information_foundation_163.sql

    steps:
      - name: Guard one-shot operation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/ops/boralog-163-remote-apply"
          test "${EXPECTED_PROJECT_REF}" = "jwtawyeuyvqjikjvfhri"
          test "${EXPECTED_SOURCE_SHA}" = "e486c2ead65350c4c97440d5ffdc044ff0ce7f07"
          test "${EXPECTED_MIGRATION_VERSION}" = "20261001163000"

      - name: Check out exact BORALOG-163 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e486c2ead65350c4c97440d5ffdc044ff0ce7f07
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and migration file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -f "${EXPECTED_MIGRATION_FILE}"
          matching_files="$(find supabase/migrations -maxdepth 1 -type f -name "${EXPECTED_MIGRATION_VERSION}_*.sql" -print)"
          matching_count="$(printf '%s
' "${matching_files}" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "${matching_count}" = "1"
          test "${matching_files}" = "${EXPECTED_MIGRATION_FILE}"

      - name: Install official Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Verify required repository secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Link CLI to fixed Boralog project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${EXPECTED_PROJECT_REF}"

      - name: Ensure IPv4 Supavisor metadata
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pooler_file="supabase/.temp/pooler-url"
          if [ -s "${pooler_file}" ]; then exit 0; fi
          response_file="${RUNNER_TEMP}/boralog-pooler-config.json"
          curl --fail --silent --show-error             --request GET             --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler"             --output "${response_file}"
          pooler_url="$(jq -er '[ .[] | select(.database_type == "PRIMARY") | .connection_string ] | if length == 1 then .[0] else error("expected exactly one PRIMARY pooler") end' "${response_file}")"
          pooler_url="${pooler_url/:[YOUR-PASSWORD]@/@}"
          pooler_url="${pooler_url/:6543//:5432/}"
          mkdir -p "$(dirname "${pooler_file}")"
          printf '%s
' "${pooler_url}" > "${pooler_file}"
          chmod 600 "${pooler_file}"

      - name: Compare migration history
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list

      - name: Dry-run and enforce migration 163 only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/boralog-db-push-dry-run.txt"
          supabase db push --dry-run 2>&1 | tee "${output_file}"
          expected_basename="$(basename "${EXPECTED_MIGRATION_FILE}")"
          mapfile -t proposed_files < <(grep -Eo '[0-9]{14}_[^[:space:]]+.sql' "${output_file}" | sed 's#^.*/##' | sort -u)
          test "${#proposed_files[@]}" = "1"
          test "${proposed_files[0]}" = "${expected_basename}"
          echo "DRY_RUN_ONLY_MIGRATION=${proposed_files[0]}"

      - name: Apply migration 163
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify exact history after apply
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list | tee "${RUNNER_TEMP}/after.txt"
          grep -Fq "${EXPECTED_MIGRATION_VERSION}" "${RUNNER_TEMP}/after.txt"

      - name: Verify no migration remains pending
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/after-dry-run.txt"
          supabase db push --dry-run 2>&1 | tee "${output_file}"
          if grep -Eq '[0-9]{14}_[^[:space:]]+.sql' "${output_file}"; then exit 1; fi
          echo "BORALOG_163_REMOTE_APPLY=PASS"
