name: Boralog Supabase migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration operation"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: boralog-supabase-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: "\${{ inputs.mode }} — Boralog only"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PROJECT_REF: jwtawyeuyvqjikjvfhri
      EXPECTED_MIGRATION_VERSION: "20260930095713"
      EXPECTED_MIGRATION_FILE: supabase/migrations/20260930095713_message_communication_provenance_155.sql
      SUPABASE_ACCESS_TOKEN: \${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: \${{ secrets.BORALOG_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install official Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Guard fixed Boralog target and expected migration
        shell: bash
        run: |
          set -euo pipefail

          echo "EXPECTED_PROJECT_REF=\${EXPECTED_PROJECT_REF}"
          echo "MODE=\${{ inputs.mode }}"

          test "\${EXPECTED_PROJECT_REF}" = "jwtawyeuyvqjikjvfhri"
          test "\${EXPECTED_MIGRATION_VERSION}" = "20260930095713"
          test "\${EXPECTED_MIGRATION_FILE}" = "supabase/migrations/20260930095713_message_communication_provenance_155.sql"
          test -f "\${EXPECTED_MIGRATION_FILE}"

          matching_files="$(find supabase/migrations -maxdepth 1 -type f -name "\${EXPECTED_MIGRATION_VERSION}_*.sql" -print)"
          matching_count="$(printf '%s\n' "\${matching_files}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "\${matching_count}" != "1" ] || [ "\${matching_files}" != "\${EXPECTED_MIGRATION_FILE}" ]; then
            echo "::error::Expected exactly one \${EXPECTED_MIGRATION_VERSION} migration file."
            exit 1
          fi

          if [ -z "\${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "\${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Required GitHub Actions repository secrets are unavailable."
            exit 1
          fi

      - name: Link CLI to fixed Boralog project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "\${EXPECTED_PROJECT_REF}"

      - name: Compare local and remote migration history
        shell: bash
        run: |
          set -euo pipefail
          output_file="\${RUNNER_TEMP}/boralog-migration-list.txt"

          set +e
          supabase migration list 2>&1 | tee "\${output_file}"
          list_status="\${PIPESTATUS[0]}"
          set -e

          if [ "\${list_status}" -ne 0 ]; then
            if grep -Eiq 'migration.*(repair|history|remote|local)|remote.*migration|migration.*not found' "\${output_file}"; then
              echo "::error title=REMOTE_LOCAL_HISTORY_MISMATCH::Supabase CLI detected incompatible local/remote migration history. This workflow never repairs history."
            else
              echo "::error::Supabase migration list failed."
            fi
            exit "\${list_status}"
          fi

      - name: Dry-run and enforce migration 155 only
        id: dry_run
        shell: bash
        run: |
          set -euo pipefail
          output_file="\${RUNNER_TEMP}/boralog-db-push-dry-run.txt"

          set +e
          supabase db push --dry-run 2>&1 | tee "\${output_file}"
          push_status="\${PIPESTATUS[0]}"
          set -e

          if [ "\${push_status}" -ne 0 ]; then
            if grep -Eiq 'migration.*(repair|history|remote|local)|remote.*migration|migration.*not found' "\${output_file}"; then
              echo "::error title=REMOTE_LOCAL_HISTORY_MISMATCH::Supabase CLI refused the dry-run because local and remote migration history differ. No repair is permitted by this workflow."
            else
              echo "::error::Supabase db push --dry-run failed. No migration was applied."
            fi
            exit "\${push_status}"
          fi

          mapfile -t proposed_versions < <(grep -Eo '[0-9]{14}' "\${output_file}" | sort -u)

          if [ "\${#proposed_versions[@]}" -ne 1 ] || [ "\${proposed_versions[0]}" != "\${EXPECTED_MIGRATION_VERSION}" ]; then
            echo "::error::Dry-run did not identify exactly one pending migration version: \${EXPECTED_MIGRATION_VERSION}. No migration was applied."
            printf 'Detected pending/version tokens: %s\n' "\${proposed_versions[*]:-none}"
            exit 1
          fi

          echo "Dry-run gate PASS: only \${EXPECTED_MIGRATION_VERSION} is eligible."

      - name: Apply migration after same-job dry-run gate
        if: \${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify migration history after apply
        if: \${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          output_file="\${RUNNER_TEMP}/boralog-migration-list-after-apply.txt"
          supabase migration list | tee "\${output_file}"

          if ! grep -Fq "\${EXPECTED_MIGRATION_VERSION}" "\${output_file}"; then
            echo "::error::Expected migration \${EXPECTED_MIGRATION_VERSION} is absent after db push."
            exit 1
          fi
