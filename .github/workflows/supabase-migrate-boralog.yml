name: Boralog Supabase migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration operation"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: boralog-supabase-migration-control-plane
  cancel-in-progress: false

jobs:
  migrate:
    name: "${{ inputs.mode }} — Boralog migration"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPECTED_PROJECT_REF: jwtawyeuyvqjikjvfhri
      FOUNDATION_SOURCE_BRANCH: build/foundation-v001
      EXPECTED_MIGRATION_VERSION: "20261001103000"
      EXPECTED_MIGRATION_FILE: supabase/migrations/20261001103000_message_reads_160.sql

    steps:
      - name: Guard control-plane dispatch
        shell: bash
        run: |
          set -euo pipefail

          echo "CONTROL_PLANE_BRANCH=main"
          echo "EXPECTED_PROJECT_REF=${EXPECTED_PROJECT_REF}"
          echo "MODE=${{ inputs.mode }}"

          test "${GITHUB_REF}" = "refs/heads/main"
          test "${EXPECTED_PROJECT_REF}" = "jwtawyeuyvqjikjvfhri"
          test "${FOUNDATION_SOURCE_BRANCH}" = "build/foundation-v001"
          test "${EXPECTED_MIGRATION_VERSION}" = "20261001103000"

      - name: Check out Foundation migration source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: build/foundation-v001
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Foundation source and migration file
        shell: bash
        run: |
          set -euo pipefail

          echo "SOURCE_BRANCH=${FOUNDATION_SOURCE_BRANCH}"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

          test -f "${EXPECTED_MIGRATION_FILE}"

          matching_files="$(find supabase/migrations -maxdepth 1 -type f -name "${EXPECTED_MIGRATION_VERSION}_*.sql" -print)"
          matching_count="$(printf '%s\n' "${matching_files}" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "${matching_count}" != "1" ] || [ "${matching_files}" != "${EXPECTED_MIGRATION_FILE}" ]; then
            echo "::error::Expected exactly ${EXPECTED_MIGRATION_FILE} for migration version ${EXPECTED_MIGRATION_VERSION}."
            exit 1
          fi

      - name: Install official Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Verify required repository secrets are available
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Required GitHub Actions repository secrets are unavailable."
            exit 1
          fi

      - name: Link CLI to fixed Boralog project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${EXPECTED_PROJECT_REF}"

      - name: Ensure IPv4 Supavisor metadata for GitHub Actions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          pooler_file="supabase/.temp/pooler-url"

          if [ -s "${pooler_file}" ]; then
            echo "IPv4 pooler metadata already available from supabase link."
            exit 0
          fi

          response_file="${RUNNER_TEMP}/boralog-pooler-config.json"

          curl --fail --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler" \
            --output "${response_file}"

          pooler_url="$(jq -er '
            [ .[] | select(.database_type == "PRIMARY") | .connection_string ]
            | if length == 1 then .[0] else error("expected exactly one PRIMARY pooler") end
          ' "${response_file}")"

          pooler_url="${pooler_url/:[YOUR-PASSWORD]@/@}"
          pooler_url="${pooler_url/:6543\//:5432\/}"

          if [ -z "${pooler_url}" ]; then
            echo "::error::Supabase Management API returned no usable PRIMARY pooler connection."
            exit 1
          fi

          mkdir -p "$(dirname "${pooler_file}")"
          printf '%s\n' "${pooler_url}" > "${pooler_file}"
          chmod 600 "${pooler_file}"

          echo "IPv4 pooler metadata prepared for linked CLI commands."

      - name: Compare local and remote migration history
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/boralog-migration-list.txt"

          set +e
          supabase migration list 2>&1 | tee "${output_file}"
          list_status="${PIPESTATUS[0]}"
          set -e

          if [ "${list_status}" -ne 0 ]; then
            if grep -Eiq 'migration.*(repair|history|remote|local)|remote.*migration|migration.*not found' "${output_file}"; then
              echo "::error title=REMOTE_LOCAL_HISTORY_MISMATCH::Supabase CLI detected incompatible local/remote migration history. No automatic repair is permitted."
            else
              echo "::error::Supabase migration list failed."
            fi
            exit "${list_status}"
          fi

      - name: Dry-run and enforce migration 160 only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/boralog-db-push-dry-run.txt"

          set +e
          supabase db push --dry-run 2>&1 | tee "${output_file}"
          push_status="${PIPESTATUS[0]}"
          set -e

          if [ "${push_status}" -ne 0 ]; then
            if grep -Eiq 'migration.*(repair|history|remote|local)|remote.*migration|migration.*not found' "${output_file}"; then
              echo "::error title=REMOTE_LOCAL_HISTORY_MISMATCH::Supabase CLI refused the dry-run because local and remote migration history differ. No automatic repair is permitted."
            else
              echo "::error::Supabase db push --dry-run failed. No migration was applied."
            fi
            exit "${push_status}"
          fi

          mapfile -t proposed_versions < <(grep -Eo '[0-9]{14}' "${output_file}" | sort -u)

          if [ "${#proposed_versions[@]}" -ne 1 ] || [ "${proposed_versions[0]}" != "${EXPECTED_MIGRATION_VERSION}" ]; then
            echo "::error::Dry-run did not identify exactly one candidate migration version: ${EXPECTED_MIGRATION_VERSION}."
            printf 'Detected migration versions: %s\n' "${proposed_versions[*]:-none}"
            exit 1
          fi

          echo "DRY_RUN_ONLY_MIGRATION=${EXPECTED_MIGRATION_FILE}"
          echo "Dry-run gate PASS."

      - name: Apply migration after same-job dry-run gate
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify exact migration history after apply
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BORALOG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/boralog-migration-list-after-apply.txt"

          supabase migration list | tee "${output_file}"

          if ! grep -Fq "${EXPECTED_MIGRATION_VERSION}" "${output_file}"; then
            echo "::error::Expected migration ${EXPECTED_MIGRATION_VERSION} is absent after db push."
            exit 1
          fi
