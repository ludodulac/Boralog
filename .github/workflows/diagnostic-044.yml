name: Diagnostic 044 machine probe

on:
  push:
    branches:
      - feat/first-organization-owner-onboarding-040

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe immutable diagnostic deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="https://6ab77e0330b21a00089bb8aa--boralog.netlify.app"
          for path in "/" "/moi" "/auth/connexion"; do
            echo "=== $path ==="
            curl -L -sS -D /tmp/headers -o /tmp/body --max-time 30 "$URL$path" || true
            head -20 /tmp/headers || true
            echo "BODY_PREFIX=$(head -c 180 /tmp/body | tr '\n' ' ' || true)"
          done
          echo "=== /auth/diagnostic/identity ==="
          curl -sS -D /tmp/probe.headers -o /tmp/probe.body --max-time 30 "$URL/auth/diagnostic/identity" || true
          cat /tmp/probe.headers || true
          cat /tmp/probe.body || true
