name: BORALOG 053 clean CI proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-ci-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
