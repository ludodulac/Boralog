name: Diagnostic 056 Server Action Boundary
on:
  push:
    branches: [diag/create-organization-boundary-056]
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: diagnostic-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start Next and capture diagnostic runtime
        shell: bash
        run: |
          set -u
          PORT=3056 npm start > /tmp/next056.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          sleep 2
          status=$(curl -sS -o /tmp/page056.html -w '%{http_code}' http://127.0.0.1:3056/diagnostic-056 || true)
          echo "DIAGNOSTIC_GET_STATUS=$status"
          echo "=== SANITIZED_FORM_MARKUP ==="
          grep -oE '<form[^>]*>|<input[^>]*>' /tmp/page056.html 2>/dev/null | sed -E 's/value="[^"]*"/value="[SANITIZED]"/g' | head -40 || true
          echo "=== NEXT_STDERR_STDOUT ==="
          cat /tmp/next056.log
          test "$status" = "200"
